<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    
    <radialGradient id="cyanGlow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glassmorphism Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="neuralLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="400" fill="#030712" />

  <!-- Ambient Glowing Orbs -->
  <rect width="1200" height="400" fill="url(#bgGlow1)" />
  <rect width="1200" height="400" fill="url(#cyanGlow)" />
  <rect width="1200" height="400" fill="url(#purpleGlow)" />

  <!-- Cyber Grid Overlay -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Neural Mesh Connections (Right Side Art) -->
  <g stroke="url(#neuralLine)" stroke-width="1.5">
    <line x1="850" y1="120" x2="960" y2="80" />
    <line x1="960" y1="80" x2="1080" y2="150" />
    <line x1="1080" y1="150" x2="1020" y2="270" />
    <line x1="1020" y1="270" x2="880" y2="300" />
    <line x1="880" y1="300" x2="850" y2="120" />
    <line x1="960" y1="80" x2="1020" y2="270" />
    <line x1="850" y1="120" x2="1080" y2="150" />
    <line x1="940" y1="190" x2="850" y2="120" />
    <line x1="940" y1="190" x2="1080" y2="150" />
    <line x1="940" y1="190" x2="1020" y2="270" />
  </g>

  <!-- Glowing Neural Nodes -->
  <g>
    <!-- Central Agent Core -->
    <circle cx="940" cy="190" r="12" fill="#38BDF8" filter="url(#glowHeavy)" opacity="0.8" />
    <circle cx="940" cy="190" r="7" fill="#FFFFFF" />

    <circle cx="850" cy="120" r="5" fill="#A855F7" filter="url(#glowLight)" />
    <circle cx="960" cy="80" r="6" fill="#38BDF8" filter="url(#glowLight)" />
    <circle cx="1080" cy="150" r="8" fill="#C084FC" filter="url(#glowLight)" />
    <circle cx="1020" cy="270" r="6" fill="#34D399" filter="url(#glowLight)" />
    <circle cx="880" cy="300" r="5" fill="#38BDF8" filter="url(#glowLight)" />
  </g>

  <!-- Kali Cyber Hex Matrix Streams (Subtle Right Panel Background) -->
  <g font-family="monospace" font-size="10" fill="#38BDF8" opacity="0.15">
    <text x="820" y="60">0x7F 0x90 0x41 0x55</text>
    <text x="1050" y="90">SEC_CHECK_OK</text>
    <text x="830" y="350">KALI_KERNEL_SYS</text>
    <text x="1000" y="340">AGENT_LOOP_READY</text>
  </g>

  <!-- Main Glassmorphism Card Container -->
  <rect x="40" y="40" width="1120" height="320" rx="20" fill="#0F172A" fill-opacity="0.5" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glowLight)" />

  <!-- Accent Corner Glow -->
  <path d="M 40,80 L 40,60 Q 40,40 60,40 L 80,40" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 1160,320 L 1160,340 Q 1160,360 1140,360 L 1120,360" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />

  <!-- Left Content Layout -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 85)">
    <rect width="210" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="15" r="4" fill="#34D399" filter="url(#glowLight)" />
    <text x="35" y="20" font-family="System-UI, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">AI &amp; CYBER ARCHITECT</text>
  </g>

  <!-- Main Name Header -->
  <text x="80" y="170" font-family="System-UI, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-size="54" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    Sanmit Patil
  </text>

  <!-- Subtitle / Role -->
  <text x="80" y="210" font-family="System-UI, -apple-system, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
    AI Engineer <tspan fill="#38BDF8">•</tspan> Cybersecurity Specialist <tspan fill="#A855F7">•</tspan> Linux Systems
  </text>

  <!-- Skill Glass Tags (Pills Row) -->
  <g transform="translate(80, 250)">
    <!-- Pill 1: AI Agents & ML -->
    <g transform="translate(0, 0)">
      <rect width="170" height="36" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="23" font-family="System-UI, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🤖 AI Agents &amp; ML</text>
    </g>

    <!-- Pill 2: Cybersecurity & Kali -->
    <g transform="translate(182, 0)">
      <rect width="195" height="36" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#A855F7" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="23" font-family="System-UI, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🛡️ Offensive Security</text>
    </g>

    <!-- Pill 3: Linux & Kali -->
    <g transform="translate(389, 0)">
      <rect width="150" height="36" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#34D399" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="23" font-family="System-UI, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🐧 Kali &amp; Linux</text>
    </g>

    <!-- Pill 4: Hackathons -->
    <g transform="translate(551, 0)">
      <rect width="170" height="36" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="23" font-family="System-UI, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🏆 Hackathon Builder</text>
    </g>
  </g>

  <!-- Bottom Terminal/Status Line -->
  <g transform="translate(80, 320)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748B">
      <tspan fill="#34D399">● SYS_STATUS:</tspan> ACTIVE_RESEARCH <tspan fill="#38BDF8">|</tspan> <tspan fill="#CBD5E1">LOCATION:</tspan> PUNE, INDIA <tspan fill="#38BDF8">|</tspan> <tspan fill="#A855F7">ARCH:</tspan> AUTONOMOUS_AGENTS_V2
    </text>
  </g>
</svg>
